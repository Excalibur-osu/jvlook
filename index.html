<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>jvlook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <nav class="tabs" id="plateTabs"></nav>
  <button id="searchToggle" class="btn search-toggle" type="button" aria-label="打开搜索" aria-expanded="false" aria-controls="searchForm" title="搜索">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
  </button>
  <form id="searchForm" class="searchbar hidden" role="search" aria-label="搜索当前分区">
    <input id="searchInput" type="search" aria-label="搜索当前分区" placeholder="搜索当前分区…" autocomplete="off">
    <button type="submit" class="btn">搜索</button>
    <button type="button" id="clearSearch" class="btn hidden">清空</button>
  </form>
</header>

<div id="labelBar" class="labelbar"></div>

<main id="listView" class="container">
  <div id="grid" class="grid"></div>
  <div id="loadMoreSentinel" class="sentinel"></div>
  <div id="listStatus" class="status" role="status"></div>
  <button id="retryList" type="button" class="btn retry hidden">重新加载</button>
</main>

<div id="detailView" class="overlay hidden">
  <div class="playerBox">
    <video id="player" controls playsinline preload="metadata"></video>
    <div id="playerHint" class="playerHint hidden">无法播放：HLS 组件加载失败且该视频没有 MP4 线路。<br>请检查网络（hls.js 需要联网加载），或返回列表换个视频。</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="loading" class="loading hidden"><div class="spinner"></div><p id="loadingText">加载中…</p></div>

<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
